<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#050408;--panel:#0d0a14;--panel2:#161022;--line:#2e2348;--ink:#f5f0ff;--mute:#a093c2;--acc:#9370db;--acc2:#b79cf0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050408;color:#f5f0ff;font-family:-apple-system,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#top{flex:none;background:linear-gradient(180deg,#150e24,#0a0710);border-bottom:1px solid #2e2348;padding:8px 10px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#brand{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-right:12px;-webkit-flex:none;flex:none}
#brand svg{width:30px;height:30px;margin-right:9px;-webkit-filter:drop-shadow(0 0 6px rgba(147,112,219,.8));filter:drop-shadow(0 0 6px rgba(147,112,219,.8))}
#bname{font-family:Baskerville,"Palatino Linotype",Palatino,Georgia,serif;font-style:italic;font-size:21px;letter-spacing:.6px;color:#f5f0ff;white-space:nowrap}
@media (max-width:660px){#bname{display:none}}
#title{-webkit-flex:1;flex:1;min-width:0;font-family:Baskerville,Palatino,Georgia,serif;font-size:17px;color:#f5f0ff;background:transparent;border:0;border-bottom:1px dashed #2e2348;border-radius:0;padding:6px 8px;-webkit-appearance:none}
#title:focus{outline:0;border-bottom:1px solid #9370db}
.btn{height:34px;padding:0 14px;margin-left:8px;font-size:14px;font-family:Baskerville,Palatino,Georgia,serif;letter-spacing:.3px;border:1px solid #9370db;background:transparent;border-radius:17px;color:#b79cf0;-webkit-appearance:none}
.btn:active{background:rgba(147,112,219,.25)}
.btn.pri{background:#9370db;color:#0a0710;font-weight:bold}
#tools{flex:none;background:#0b0812;border-bottom:1px solid #2e2348;padding:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
#tools .g{display:inline-block;vertical-align:middle;padding-right:8px;margin-right:8px;border-right:1px solid #2e2348}
#tools .g:last-child{border-right:0}
#tools button,#tools select{height:36px;min-width:36px;font-size:16px;margin:0 1px;border:1px solid transparent;background:transparent;border-radius:8px;color:#f5f0ff;padding:0 6px;-webkit-user-select:none;user-select:none;-webkit-appearance:none}
#tools button:active{background:rgba(147,112,219,.25)}
#tools button.on{background:rgba(147,112,219,.28);border-color:#9370db;color:#fff}
#tools select{border-color:#2e2348;background:#161022;max-width:130px;padding:0 10px}
#wrap{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 6px 40px;
 background-color:#050408;
 background-image:radial-gradient(1px 1px at 30px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 95px,#cbb6ff,transparent),radial-gradient(1px 1px at 205px 25px,#fff,transparent),radial-gradient(1px 1px at 75px 165px,#b79cf0,transparent),radial-gradient(1px 1px at 170px 150px,#e6dcff,transparent),radial-gradient(ellipse at 50% -10%,rgba(147,112,219,.28),transparent 55%);
 background-size:240px 200px,240px 200px,240px 200px,240px 200px,240px 200px,100% 100%;
 background-repeat:repeat,repeat,repeat,repeat,repeat,no-repeat}
.orn{text-align:center;color:#9370db;letter-spacing:10px;font-size:13px;opacity:.85;margin:4px 0 10px;text-shadow:0 0 8px rgba(147,112,219,.8)}
#page{position:relative;margin:0 auto;width:794px;padding:96px;background:linear-gradient(180deg,#110c1c,#0b0812 40%);border:1px solid #2e2348;border-radius:4px;box-shadow:0 0 0 1px rgba(147,112,219,.12),0 12px 40px rgba(0,0,0,.7),0 0 70px rgba(147,112,219,.14)}
#page:before,#page:after{position:absolute;top:10px;color:#9370db;font-size:12px;opacity:.7;content:"✦"}
#page:before{left:14px}
#page:after{right:14px}
#editor{outline:0;min-height:300px;font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.3225;color:#f5f0ff;caret-color:#b79cf0;word-wrap:break-word;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#editor::selection,#editor *::selection{background:rgba(147,112,219,.55);color:#fff}
#editor.isempty>div:first-child:before{content:"Comece a escrever sua escritura…";color:#6f6290;font-style:italic}
#editor p,#editor div{margin:0}
#editor h1{font-size:24pt;margin:12pt 0 4pt;color:#d7c4ff}
#editor h2{font-size:18pt;margin:12pt 0 4pt;color:#cdb4ff}
#editor h3{font-size:14pt;margin:12pt 0 4pt;color:#c4a8ff}
#editor h4,#editor h5,#editor h6{font-size:12pt;margin:12pt 0 4pt;color:#bba0f5}
#editor ul,#editor ol{margin:0;padding-left:28px}
#editor li::marker{color:#9370db}
#editor table{border-collapse:collapse;width:100%;margin:6px 0}
#editor td,#editor th{border:1px solid #4a3a70;padding:4px 6px;vertical-align:top;min-width:30px}
#editor img{max-width:100%;height:auto;border-radius:3px}
#editor blockquote{margin:0 0 0 40px;border:0;padding:0}
#editor a{color:#b79cf0}
#editor hr{border:0;border-top:1px solid #4a3a70;margin:8px 0}
#status{flex:none;background:#0a0710;border-top:1px solid #2e2348;font-family:Baskerville,Palatino,Georgia,serif;font-style:italic;font-size:12px;color:#a093c2;padding:5px 12px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
#pal{display:none;position:fixed;z-index:20;background:#130e1f;border:1px solid #9370db;border-radius:10px;padding:8px;width:236px;box-shadow:0 8px 24px rgba(0,0,0,.7),0 0 24px rgba(147,112,219,.25)}
#pal span{display:inline-block;width:30px;height:30px;margin:2px;border:1px solid #4a3a70;border-radius:50%}
#pal button{width:100%;margin-top:6px;height:34px;border:1px solid #9370db;background:transparent;color:#b79cf0;border-radius:8px;font-size:14px}
#modal{display:none;position:fixed;z-index:30;top:0;left:0;right:0;bottom:0;background:rgba(3,2,6,.78)}
#sheet{background:#110c1c;color:#f5f0ff;max-width:480px;margin:40px auto 0;border:1px solid #9370db;border-radius:14px;padding:16px;max-height:80%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 0 40px rgba(147,112,219,.3)}
#sheet h3{margin:0 0 10px;font-family:Baskerville,Palatino,Georgia,serif;font-style:italic;font-weight:normal;font-size:21px;text-align:center;color:#d7c4ff}
#sheet h3:before{content:"✦ ";color:#9370db}
#sheet h3:after{content:" ✦";color:#9370db}
#sheet p{color:#d9cff2}
#sheet button.it{display:block;width:100%;text-align:left;font-size:17px;padding:13px 10px;border:0;border-bottom:1px solid #2e2348;background:transparent;color:#f5f0ff}
#sheet button.it:active{background:rgba(147,112,219,.25)}
#sheet .row{display:-webkit-flex;display:flex;border-bottom:1px solid #2e2348;-webkit-align-items:center;align-items:center}
#sheet .row button.it{border:0;-webkit-flex:1;flex:1}
#sheet .row small{color:#a093c2;font-size:12px;padding:0 8px}
#sheet .x{width:100%;margin-top:12px;height:42px;font-size:16px;border:1px solid #9370db;background:transparent;color:#b79cf0;border-radius:10px}
#sheet .ok{background:#9370db;color:#0a0710;font-weight:bold}
#sheet a.big{display:block;margin:10px 0;padding:14px;background:#9370db;color:#0a0710;text-align:center;border-radius:10px;text-decoration:none;font-size:17px;font-weight:bold}
#sheet label{display:block;margin:8px 0;font-size:14px;color:#a093c2}
#sheet input,#sheet select{display:block;width:100%;height:38px;font-size:16px;margin-top:3px;border:1px solid #2e2348;border-radius:8px;padding:0 10px;background:#161022;color:#f5f0ff;-webkit-appearance:none}
#sheet input:focus,#sheet select:focus{outline:0;border-color:#9370db}
#sheet .two{display:-webkit-flex;display:flex}
#sheet .two label{-webkit-flex:1;flex:1;margin-right:6px}
#sheet .two label:last-child{margin-right:0}
@media print{
 html,body{height:auto;background:#fff;color:#000}
 #top,#tools,#status,#pal,#modal,.orn{display:none!important}
 #app{position:static;display:block}
 #wrap{overflow:visible;padding:0;background:none}
 #page{background:#fff;border:0;box-shadow:none;padding:0!important;width:auto!important;max-width:none;min-height:0!important}
 #page:before,#page:after{display:none}
 #editor,#editor h1,#editor h2,#editor h3,#editor h4,#editor h5,#editor h6,#editor a{color:#000}
 #editor [style*="245, 240, 255"],#editor [style*="#f5f0ff"]{color:#000!important}
}
</style>
<style id="dyn"></style>
</head>

<div id="app">
 <div id="top">
  <div id="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#9370db"/><path d="M18.5 3l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="#f5f0ff"/></svg><span id="bname">Escrituras Escritas</span></div>
  <input id="title" type="text" value="Escritura sem título" aria-label="Título">

 </div>

 <div id="wrap"><div class="orn">✦ ☾ ✦</div><div id="page"><div id="editor" contenteditable="true" spellcheck="true" lang="pt-BR" autocorrect="on" autocapitalize="sentences"><div><br></div></div></div><div class="orn" style="margin-top:14px">✧ ☽ ✧</div></div>
 <div id="status"><span id="wc">0 palavras</span><span id="sv"></span></div>

<input type="file" id="fOpen" accept=".txt,.html,.htm,text/plain,text/html" style="display:none">

<script>
(function(){
'use strict';

/* ===================== utilidades ===================== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nn(v){return (Math.round(v*100)/100).toString();}
function b64(s){var bin=atob(s),u=new Uint8Array(bin.length),i;for(i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function utf8(s){
  s=String(s).replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g,function(m,a){return a||'';});
  var str=unescape(encodeURIComponent(s)),u=new Uint8Array(str.length),i;
  for(i=0;i<str.length;i++)u[i]=str.charCodeAt(i);
  return u;
}

var ed=$('editor'), titleEl=$('title');
var savedRange=null, pendingSize=null, saveTimer=null;

/* ===================== seleção ===================== */
function saveSel(){
  var s=window.getSelection();
  if(s&&s.rangeCount){
    var r=s.getRangeAt(0);
    if(ed.contains(r.commonAncestorContainer))savedRange=r.cloneRange();
  }
}
function restoreSel(){
  ed.focus();
  if(savedRange){
    var s=window.getSelection();
    s.removeAllRanges();
    s.addRange(savedRange);
  }
}
document.addEventListener('selectionchange',function(){saveSel();updateStates();});

/* ===================== comandos ===================== */
function cmd(name,val,css){
  restoreSel();
  try{document.execCommand('styleWithCSS',false,!!css);}catch(e){}
  document.execCommand(name,false,val===undefined?null:val);
  saveSel();
  onChange();
}
function fixFonts(){
  if(!pendingSize)return;
  var fs=ed.querySelectorAll('font[size="7"]');
  if(!fs.length)return;
  var s=window.getSelection(),an=s.anchorNode,ao=s.anchorOffset,fn=s.focusNode,fo=s.focusOffset,i;
  for(i=0;i<fs.length;i++){
    var f=fs[i],sp=document.createElement('span');
    sp.style.fontSize=pendingSize+'pt';
    while(f.firstChild)sp.appendChild(f.firstChild);
    f.parentNode.replaceChild(sp,f);
  }
  try{if(an&&fn&&s.setBaseAndExtent)s.setBaseAndExtent(an,ao,fn,fo);}catch(e){}
}
function applySize(pt){
  restoreSel();
  pendingSize=pt;
  try{document.execCommand('styleWithCSS',false,false);}catch(e){}
  document.execCommand('fontSize',false,'7');
  fixFonts();
  saveSel();
  onChange();
}
function up(node,tags){
  while(node&&node!==ed){
    if(node.nodeType===1&&tags.indexOf(node.tagName)>=0)return node;
    node=node.parentNode;
  }
  return null;
}
function curNode(){var s=window.getSelection();return s&&s.anchorNode?s.anchorNode:(savedRange?savedRange.startContainer:null);}

/* ===================== barra de ferramentas ===================== */
var tools=$('tools'),stateBtns={};
function group(){var g=document.createElement('span');g.className='g';tools.appendChild(g);return g;}
function addBtn(g,html,title,fn,stateCmd){
  var b=document.createElement('button');
  b.type='button';b.innerHTML=html;b.title=title;b.setAttribute('aria-label',title);
  b.addEventListener('mousedown',function(e){e.preventDefault();});
  b.addEventListener('click',function(e){e.preventDefault();fn(b);});
  g.appendChild(b);
  if(stateCmd)stateBtns[stateCmd]=b;
  return b;
}
function addSel(g,title,opts,fn){
  var s=document.createElement('select');
  s.setAttribute('aria-label',title);
  var i;
  for(i=0;i<opts.length;i++){var o=document.createElement('option');o.value=opts[i][1];o.textContent=opts[i][0];s.appendChild(o);}
  s.addEventListener('change',function(){
    var v=s.value;
    if(v!==''){restoreSel();fn(v);}
    s.selectedIndex=0;
  });
  g.appendChild(s);
}
function updateStates(){
  var k;
  for(k in stateBtns){
    if(stateBtns.hasOwnProperty(k)){
      var on=false;
      try{on=document.queryCommandState(k);}catch(e){}
      stateBtns[k].className=on?'on':'';
    }
  }
}

var COLORS=['#434343','#666666','#999999','#cccccc','#ffffff','#ff0000','#ff9900','#ffff00','#00ff00','#00ffff','#0000ff','#9900ff','#ff00ff','#e6b8af','#f4cccc','#fce5cd','#fff2cc','#d9ead3','#d0e0e3','#c9daf8','#cfe2f3','#d9d2e9','#ead1dc','#cc0000','#e69138','#f1c232','#6aa84f','#45818e','#3c78d8','#3d85c6','#674ea7','#a64d79','#990000','#b45f06','#bf9000','#38761d','#134f5c','#1155cc','#0b5394','#351c75','#741b47'];
var pal=$('pal');
function showPalette(anchor,resetLabel,onPick){
  pal.innerHTML='';
  var i;
  for(i=0;i<COLORS.length;i++){
    (function(c){
      var sp=document.createElement('span');
      sp.style.background=c;
      sp.addEventListener('mousedown',function(e){e.preventDefault();});
      sp.addEventListener('click',function(e){e.preventDefault();hidePalette();onPick(c);});
      pal.appendChild(sp);
    })(COLORS[i]);
  }
  var rb=document.createElement('button');
  rb.type='button';rb.textContent=resetLabel;
  rb.addEventListener('mousedown',function(e){e.preventDefault();});
  rb.addEventListener('click',function(e){e.preventDefault();hidePalette();onPick(null);});
  pal.appendChild(rb);
  var r=anchor.getBoundingClientRect();
  pal.style.display='block';
  pal.style.left=Math.max(4,Math.min(r.left,window.innerWidth-244))+'px';
  pal.style.top=(r.bottom+4)+'px';
}
function hidePalette(){pal.style.display='none';}
document.addEventListener('click',function(e){
  if(pal.style.display==='block'&&!pal.contains(e.target)&&!/btnpal/.test(e.target.className||''))hidePalette();
},true);

function buildToolbar(){
  var g=group();
  addBtn(g,'↶','Desfazer',function(){cmd('undo');});
  addBtn(g,'↷','Refazer',function(){cmd('redo');});
  g=group();
  addSel(g,'Estilo',[['Estilo',''],['Texto normal','<p>'],['Título 1','<h1>'],['Título 2','<h2>'],['Título 3','<h3>'],['Título 4','<h4>']],function(v){cmd('formatBlock',v);});
  addSel(g,'Fonte',[['Fonte',''],['Arial','Arial'],['Times New Roman','Times New Roman'],['Georgia','Georgia'],['Verdana','Verdana'],['Courier New','Courier New']],function(v){cmd('fontName',v,true);});
  addSel(g,'Tamanho',[['Tam.',''],['8','8'],['9','9'],['10','10'],['11','11'],['12','12'],['14','14'],['16','16'],['18','18'],['24','24'],['30','30'],['36','36'],['48','48']],function(v){applySize(parseInt(v,10));});
  addBtn(g,'A−','Diminuir fonte',function(){stepSize(-1);});
  addBtn(g,'A+','Aumentar fonte',function(){stepSize(1);});
  g=group();
  addBtn(g,'<b>B</b>','Negrito',function(){cmd('bold');},'bold');
  addBtn(g,'<i>I</i>','Itálico',function(){cmd('italic');},'italic');
  addBtn(g,'<u>U</u>','Sublinhado',function(){cmd('underline');},'underline');
  addBtn(g,'<s>S</s>','Tachado',function(){cmd('strikeThrough');},'strikeThrough');
  addBtn(g,'x<sup>2</sup>','Sobrescrito',function(){cmd('superscript');},'superscript');
  addBtn(g,'x<sub>2</sub>','Subscrito',function(){cmd('subscript');},'subscript');
  g=group();
  var bc=addBtn(g,'<span style="border-bottom:3px solid #9370db">A</span>','Cor do texto',function(b){showPalette(b,'Automático (padrão)',function(c){cmd('foreColor',c||'#f5f0ff',true);});});
  bc.className='btnpal';
  var bh=addBtn(g,'<span style="background:#9370db;color:#0a0710;padding:0 4px;border-radius:3px">A</span>','Realce',function(b){showPalette(b,'Sem realce',function(c){cmd('hiliteColor',c||'transparent',true);});});
  bh.className='btnpal';
  g=group();
  addBtn(g,'⇤','Alinhar à esquerda',function(){cmd('justifyLeft');});
  addBtn(g,'≡','Centralizar',function(){cmd('justifyCenter');});
  addBtn(g,'⇥','Alinhar à direita',function(){cmd('justifyRight');});
  addBtn(g,'☰','Justificar',function(){cmd('justifyFull');});
  addBtn(g,'↕','Entrelinhas e espaçamento',lineMenu);
  addBtn(g,'¶','Parágrafo…',paraDialog);
  g=group();
  addBtn(g,'• ≡','Lista com marcadores',function(){cmd('insertUnorderedList');});
  addBtn(g,'1. ≡','Lista numerada',function(){cmd('insertOrderedList');});
  addBtn(g,'←','Diminuir recuo',function(){indentBy(-1);});
  addBtn(g,'→','Aumentar recuo',function(){indentBy(1);});
  addBtn(g,'⇥¶','Recuo da primeira linha',firstLine);
  g=group();
  addBtn(g,'Link','Link',function(){
    var u=window.prompt('Endereço do link (https://...)','https://');
    if(u&&u!=='https://')cmd('createLink',u);
  });
  addBtn(g,'▣','Imagem',function(){saveSel();$('fImg').click();});
  addBtn(g,'▦','Tabela',tableMenu);
  addBtn(g,'―','Linha horizontal',function(){cmd('insertHorizontalRule');});
  addBtn(g,'Tx','Limpar formatação',function(){cmd('removeFormat');});
}

/* ===================== página, modelos e parágrafo ===================== */
var PAPERS={'A4':[21,29.7],'Carta':[21.59,27.94],'A5':[14.8,21],'Ofício':[21.59,33.02]};
var PRESETS={
  padrao:{name:'Padrão (Arial 11, 1,15, margens 2,54 cm)',cfg:{paper:'A4',land:false,mt:2.54,mr:2.54,mb:2.54,ml:2.54,font:'Arial',size:11,line:1.15,after:0}},
  word:{name:'Word moderno (Calibri 11, 1,08, 8 pt depois)',cfg:{paper:'A4',land:false,mt:2.54,mr:2.54,mb:2.54,ml:2.54,font:'Calibri',size:11,line:1.08,after:8}},
  abnt:{name:'ABNT (Times 12, 1,5, margens 3/2/3/2)',cfg:{paper:'A4',land:false,mt:3,mr:2,mb:2,ml:3,font:'Times New Roman',size:12,line:1.5,after:0}}
};
function copyCfg(c){var o={},k;for(k in c)if(c.hasOwnProperty(k))o[k]=c[k];return o;}
var cfg=copyCfg(PRESETS.padrao.cfg);
function fontStack(f){
  var m={'Calibri':'Calibri,Carlito,Arial,sans-serif','Times New Roman':'"Times New Roman",Times,serif','Georgia':'Georgia,serif','Courier New':'"Courier New",Courier,monospace','Verdana':'Verdana,sans-serif','Arial':'Arial,Helvetica,sans-serif'};
  return m[f]||('"'+f+'",Arial,sans-serif');
}
function pageDims(){
  var p=PAPERS[cfg.paper]||PAPERS.A4,w=p[0],h=p[1],t;
  if(cfg.land){t=w;w=h;h=t;}
  return {w:w,h:h};
}
function applyCfg(){
  var pd=pageDims(),CM=37.795,full=pd.w*CM,wrapW=$('wrap').clientWidth-12,k=1;
  if(wrapW>200&&wrapW<full)k=wrapW/full;
  var pg=$('page');
  pg.style.width=Math.round(full*k)+'px';
  pg.style.minHeight=Math.round(pd.h*CM*k)+'px';
  pg.style.paddingTop=Math.round(cfg.mt*CM*k)+'px';
  pg.style.paddingBottom=Math.round(cfg.mb*CM*k)+'px';
  pg.style.paddingLeft=Math.round(cfg.ml*CM*k)+'px';
  pg.style.paddingRight=Math.round(cfg.mr*CM*k)+'px';

function leafBlocks(){
  restoreSel();
  var s=window.getSelection();
  if(!s||!s.rangeCount)return [];
  var r=s.getRangeAt(0),all=ed.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li,blockquote,td,th'),res=[],i;
  for(i=0;i<all.length;i++){
    var el=all[i];
    if(el.querySelector('p,div,h1,h2,h3,h4,h5,h6,li,blockquote,table,ul,ol'))continue;
    if(!r.intersectsNode(el))continue;
    if(!r.collapsed&&r.endOffset===0&&el.contains(r.endContainer)&&!el.contains(r.startContainer))continue;
    res.push(el);
  }
  return res;
}
function applyToBlocks(fn){

var SIZES=[8,9,10,11,12,14,16,18,24,30,36,48];
function stepSize(dir){
  restoreSel();
  var n=curNode(),el=n&&n.nodeType===3?n.parentNode:n,px=14.67,i,out=0;
  try{if(el)px=parseFloat(window.getComputedStyle(el).fontSize)||px;}catch(e){}
  var pt=Math.round(px*0.75*2)/2;
  if(dir>0){
    for(i=0;i<SIZES.length;i++)if(SIZES[i]>pt+0.01){out=SIZES[i];break;}
    if(!out)out=SIZES[SIZES.length-1];
  }else{
    out=SIZES[0];
    for(i=SIZES.length-1;i>=0;i--)if(SIZES[i]<pt-0.01){out=SIZES[i];break;}
  }
  applySize(out);
}
function parseLen(v){
  if(!v)return null;
  var m=/^(-?[\d.]+)(pt|px|cm|mm|in|em)?$/.exec(String(v).replace(/^\s+|\s+$/g,''));
  if(!m)return null;
  var n=parseFloat(m[1]),u=m[2]||'px';
  if(u==='pt')return n;
  if(u==='px')return n*0.75;
  if(u==='cm')return n*28.3465;
  if(u==='mm')return n*2.83465;
  if(u==='in')return n*72;
  if(u==='em')return n*12;
  return null;
}

function sanitizeHtml(h){
  var doc=new DOMParser().parseFromString(h,'text/html'),bad=doc.querySelectorAll('script,iframe,object,embed,link,meta,style,form,input,button,select,textarea'),i;
  for(i=0;i<bad.length;i++)bad[i].parentNode.removeChild(bad[i]);
  var all=doc.body.querySelectorAll('*'),j,k;
  for(j=0;j<all.length;j++){
    var at=all[j].attributes;
    for(k=at.length-1;k>=0;k--){
      var nm=at[k].name.toLowerCase();
      if(nm.indexOf('on')===0||(/^(href|src)$/.test(nm)&&/^\s*javascript:/i.test(at[k].value)))all[j].removeAttribute(at[k].name);
    }
  }
  return doc.body.innerHTML;
}

  var b=$('mbody');
  b.innerHTML='<h3>Arquivo pronto</h3><p><b>'+esc(name)+'</b></p>'+

function hx(n){n=parseInt(n,10);if(n>255)n=255;return (n<16?'0':'')+n.toString(16);}

function buildIR(root){
  var numList=[],numCounter=0,out=[];
  var base={b:false,i:false,u:false,s:false,color:null,bg:null,size:null,font:null,href:null,va:null};
  var bc0=blankBc();

  function walk(parent,st0,bc,outArr){
    var cur=null;
    function para(){
      if(!cur){cur={t:'p',align:bc.align,left:bc.left,right:bc.right,first:bc.first,before:bc.before,after:bc.after,line:bc.line,head:bc.head,list:bc.list,runs:[]};outArr.push(cur);}
      return cur;
    }
    function flush(){
      if(cur){var r=cur.runs;while(r.length&&r[r.length-1].br)r.pop();cur=null;}
    }
    function addText(tx,st){
      tx=tx.replace(/[\u200b\ufeff]/g,'').replace(/[ \t\r\n]+/g,' ').replace(/\u00a0/g,' ');
      if(!tx)return;
      if(!cur||!cur.runs.length)tx=tx.replace(/^ +/,'');
      if(!tx)return;
      var p=para();
      p.runs.push({text:tx,b:st.b,i:st.i,u:st.u||!!st.href,s:st.s,color:st.color||(st.href?'1155CC':null),bg:st.bg,size:st.size,font:st.font,href:st.href,va:st.va});
    }
    function proc(node,st){
      var k;
      for(k=0;k<node.childNodes.length;k++){
        var n=node.childNodes[k];
        if(n.nodeType===3){addText(n.nodeValue,st);continue;}
        if(n.nodeType!==1)continue;
        var tag=n.tagName;
        if(tag==='BR'){para().runs.push({br:true});continue;}
        if(tag==='SCRIPT'||tag==='STYLE')continue;
        if(tag==='IMG'){
          var src=n.getAttribute('src')||'';
          if(/^data:image\/jpe?g;base64,/i.test(src)){
            var w=+n.getAttribute('data-w')||n.naturalWidth||200,h=+n.getAttribute('data-h')||n.naturalHeight||150;
            if(w>600){h=h*600/w;w=600;}
            para().runs.push({img:{src:src,w:w,h:h}});
          }
          continue;
        }
        if(tag==='HR'){flush();outArr.push({t:'hr'});continue;}
        if(tag==='TABLE'){flush();outArr.push(tableIR(n));continue;}
        if(tag==='UL'||tag==='OL'){
          flush();
          var ordered=tag==='OL',lvl=bc.lvl+1,numId;
          if(!ordered)numId=1;
          else if(bc.list&&bc.list.ordered)numId=bc.list.numId;
          else{numCounter++;numId=numCounter+1;numList.push(numId);}
          var nbc=bctx(n,bc);nbc.lvl=lvl;nbc.list={ordered:ordered,level:lvl,numId:numId};
          walk(n,styleFor(n,st),nbc,outArr);
          continue;
        }
        if(tag==='LI'){flush();walk(n,styleFor(n,st),bctx(n,bc),outArr);continue;}
        if(BLOCK[tag]){flush();walk(n,styleFor(n,st),bctx(n,bc),outArr);continue;}
        proc(n,styleFor(n,st));
      }
    }
    proc(parent,st0);
    flush();
  }

  function tableIR(t){
    var rows=[],trs=t.rows,i,j;
    for(i=0;i<trs.length;i++){
      var cells=[],tcs=trs[i].cells;
      for(j=0;j<tcs.length;j++){

        walk(tcs[j],styleFor(tcs[j],base),blankBc(),sub);
        if(!sub.length)sub.push({t:'p',align:null,left:0,right:0,first:null,before:null,after:null,line:null,head:0,list:null,runs:[]});
        cells.push({blocks:sub});
      }
      rows.push(cells);
    }
    return {t:'table',rows:rows};
  }

  walk(root,base,bc0,out);
  return {blocks:out,nums:numList};
}

var crcTable=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();

function makeZip(files,mime){

  var ddate=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();

    var f=files[i],name=utf8(f.name),crc=crc32(f.data),size=f.data.length;

    dv.setUint16(10,dtime,true);dv.setUint16(12,ddate,true);dv.setUint32(14,crc,true);

    loc.set(name,30);

    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);
    cv.setUint16(12,dtime,true);cv.setUint16(14,ddate,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,size,true);cv.setUint32(24,size,true);cv.setUint16(28,name.length,true);
    cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    cen.set(name,46);

  for(i=0;i<central.length;i++)cdSize+=central[i].length;

  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  return new Blob(parts.concat(central,[eo]),{type:mime});
}

  for(l=0;l<9;l++){
    var left=420*(l+1);
    a0+='<w:lvl w:ilvl="'+l+'"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="\u2022"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="'+left+'" w:hanging="280"/></w:pPr><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:hint="default"/></w:rPr></w:lvl>';
    a1+='<w:lvl w:ilvl="'+l+'"><w:start w:val="1"/><w:numFmt w:val="'+fm[l%3]+'"/><w:lvlText w:val="%'+(l+1)+'."/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="'+left+'" w:hanging="360"/></w:pPr></w:lvl>';
  }
  var nums='<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>';
  for(i=0;i<ir.nums.length;i++)nums+='<w:num w:numId="'+ir.nums[i]+'"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>';
  var numXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering xmlns:w="'+NS_W+'"><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>'+a0+'</w:abstractNum><w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/>'+a1+'</w:abstractNum>'+nums+'</w:numbering>';

  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/>'+
   '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
   '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'+
   '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/></Types>';
  var rootRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  var docRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
   '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
   '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'+rels.join('')+'</Relationships>';

  var files=[
    {name:'[Content_Types].xml',data:utf8(ct)},
    {name:'_rels/.rels',data:utf8(rootRels)},
    {name:'word/document.xml',data:utf8(docXml)},
    {name:'word/_rels/document.xml.rels',data:utf8(docRels)},
    {name:'word/styles.xml',data:utf8(stylesXml)},
    {name:'word/numbering.xml',data:utf8(numXml)}
  ];
  for(i=0;i<media.length;i++)files.push(media[i]);
  return makeZip(files,'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
}

/* ===================== PDF ===================== */
var CP1252={0x20AC:128,0x201A:130,0x0192:131,0x201E:132,0x2026:133,0x2020:134,0x2021:135,0x02C6:136,0x2030:137,0x0160:138,0x2039:139,0x0152:140,0x017D:142,0x2018:145,0x2019:146,0x201C:147,0x201D:148,0x2022:149,0x2013:150,0x2014:151,0x02DC:152,0x2122:153,0x0161:154,0x203A:155,0x0153:156,0x017E:158,0x0178:159};
function pdfStr(t){
  var s='(',i;
  for(i=0;i<t.length;i++){
    var c=t.charCodeAt(i);
    if(c>255)c=CP1252[c]||63;
    if(c<32)continue;
    if(c===40||c===41||c===92)s+='\\';
    s+=String.fromCharCode(c);
  }
  return s+')';
}
function jpegInfo(u){
  var i=2;
  while(i+9<u.length){
    if(u[i]!==0xFF){i++;continue;}
    var m=u[i+1];
    if(m===0xFF){i++;continue;}
    if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return {h:(u[i+5]<<8)|u[i+6],w:(u[i+7]<<8)|u[i+8],c:u[i+9]};
    if(m===0xD8||m===0x01||(m>=0xD0&&m<=0xD7)){i+=2;continue;}
    i+=2+((u[i+2]<<8)|u[i+3]);
  }
  return null;
}
function romanOf(n){
  var m=[[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']],s='',i;
  for(i=0;i<m.length;i++)while(n>=m[i][0]){s+=m[i][1];n-=m[i][0];}
  return s;
}
function alphaOf(n){var s='';while(n>0){n--;s=String.fromCharCode(97+n%26)+s;n=Math.floor(n/26);}return s;}

function makePDF(ir){
  var pd0=pageDims(),PW=pd0.w*28.3465,PH=pd0.h*28.3465,ML=cfg.ml*28.3465,MR=cfg.mr*28.3465,MT=cfg.mt*28.3465,MB=cfg.mb*28.3465,CW=PW-ML-MR,DEF=cfg.size,HS={1:24,2:18,3:14,4:12,5:12,6:12};
  var cv=document.createElement('canvas').getContext('2d'),wcache={},images=[],counters={};
  var cur=null;

  function famOf(f){
    f=(f||'').toLowerCase();
    if(/courier|mono/.test(f))return 2;
    if(/times|georgia|serif|cambria|garamond/.test(f)&&!/sans/.test(f))return 1;
    return 0;
  }
  function tw(text,fi,size){
    var key=fi+'|'+text,w=wcache[key];
    if(w===undefined){
      cv.font=((fi&2)?'italic ':'')+((fi&1)?'bold ':'')+'100px '+['Arial','"Times New Roman"','"Courier New"'][fi>>2];
      w=cv.measureText(text).width/100;
      wcache[key]=w;
    }
    return w*size;
  }
  function rgb(hex,suffix){
    if(!hex)hex='000000';
    return nn(parseInt(hex.substr(0,2),16)/255).replace(/^(\d)$/,'$1')+' '+nn(parseInt(hex.substr(2,2),16)/255)+' '+nn(parseInt(hex.substr(4,2),16)/255)+' '+suffix;
  }
  function emit(s){cur.push(s);}

  function drawItem(it,x,base){
    var r=it.r,size=it.size,Y=PH-base+(it.rise||0);
    if(it.img){
      emit('q '+nn(it.w)+' 0 0 '+nn(it.h)+' '+nn(x)+' '+nn(PH-base)+' cm /Im'+it.k+' Do Q');
      return;
    }
    if(r.bg){emit(rgb(r.bg,'rg'));emit(nn(x)+' '+nn(Y-size*0.22)+' '+nn(it.w)+' '+nn(size*1.15)+' re f');}
    if(!it.sp&&it.text){
      emit(rgb(r.color,'rg'));
      emit('BT /F'+it.fi+' '+nn(size)+' Tf '+nn(x)+' '+nn(Y)+' Td '+pdfStr(it.text)+' Tj ET');
    }
    if(r.u){emit(rgb(r.color,'RG'));emit(nn(size*0.06)+' w '+nn(x)+' '+nn(Y-size*0.12)+' m '+nn(x+it.w)+' '+nn(Y-size*0.12)+' l S');}
    if(r.s){emit(rgb(r.color,'RG'));emit(nn(size*0.06)+' w '+nn(x)+' '+nn(Y+size*0.28)+' m '+nn(x+it.w)+' '+nn(Y+size*0.28)+' l S');}
  }

  function markerFor(p){
    if(!p.list)return null;
    if(!p.list.ordered)return p.list.level%2?'-':'\u2022';
    var c=counters[p.list.numId]||(counters[p.list.numId]=[]),l=p.list.level;
    c[l]=(c[l]||0)+1;c.length=l+1;
    var n=c[l],m=l%3;
    return (m===0?String(n):(m===1?alphaOf(n):romanOf(n)))+'.';
  }

  function layoutPara(p,x0,width,pieces){
    var size0=p.head?HS[p.head]:DEF;
    var lvlInd=p.list?21*(p.list.level+1):0,leftPt=(p.left||0)+lvlInd;
    var tx=x0+leftPt,avail=Math.max(40,width-leftPt-(p.right||0));
    var firstPt=(!p.list&&p.first)||0;
    var marker=markerFor(p),toks=[],i,k;
    for(i=0;i<p.runs.length;i++){
      var r=p.runs[i];
      if(r.br){toks.push({br:true});continue;}
      if(r.img){
        var info=null,c=r.img.src.indexOf(',');
        var u8=b64(r.img.src.substring(c+1));info=jpegInfo(u8);
        if(!info||(info.c!==1&&info.c!==3))continue;
        var w=r.img.w*0.75,h=r.img.h*0.75;
        if(w>avail){h=h*avail/w;w=avail;}
        if(h>PH-MT-MB-30){w=w*(PH-MT-MB-30)/h;h=PH-MT-MB-30;}
        images.push({data:u8,info:info});
        toks.push({img:true,w:w,h:h,k:images.length-1,sp:false,r:r,size:size0});
        continue;
      }
      var size=r.size||size0,rise=0;
      if(r.va){rise=(r.va==='sup'?0.35:-0.12)*size;size=size*0.65;}
      var fi=famOf(r.font||cfg.font)*4+((r.b||p.head)?1:0)+(r.i?2:0);
      var parts=r.text.split(/( +)/);
      for(k=0;k<parts.length;k++){
        var part=parts[k];
        if(part==='')continue;
        var sp=part.charAt(0)===' ';
        var wd=tw(part,fi,size);
        if(!sp&&wd>avail){
          var s='',q;
          for(q=0;q<part.length;q++){
            var ch=part.charAt(q);
            if(s&&tw(s+ch,fi,size)>avail){toks.push({text:s,sp:false,fi:fi,size:size,w:tw(s,fi,size),r:r,rise:rise});s=ch;}else s+=ch;
          }
          if(s)toks.push({text:s,sp:false,fi:fi,size:size,w:tw(s,fi,size),r:r,rise:rise});
        }else toks.push({text:part,sp:sp,fi:fi,size:size,w:wd,r:r,rise:rise});
      }
    }
    var lines=[],line={items:[],w:0,forced:false};
    function endLine(forced){
      while(line.items.length&&line.items[line.items.length-1].sp)line.w-=line.items.pop().w;
      line.forced=forced;lines.push(line);line={items:[],w:0,forced:false};
    }
    for(i=0;i<toks.length;i++){
      var t=toks[i];
      if(t.br){endLine(true);continue;}
      if(t.sp&&!line.items.length)continue;
      var cap=(lines.length===0?avail-firstPt:avail);
      if(!t.sp&&line.items.length&&line.w+t.w>cap+0.01)endLine(false);
      line.items.push(t);line.w+=t.w;
    }
    endLine(false);
    var bef=p.before!=null?p.before:(p.head?(p.head===1?12:10):0),aft=p.after!=null?p.after:(p.head?4:(p.list?0:cfg.after));
    if(bef>0)pieces.push({h:bef,draw:function(){}});
    for(i=0;i<lines.length;i++){
      (function(ln,idx){
        var ms=0,ih=0,j;
        for(j=0;j<ln.items.length;j++){
          var it=ln.items[j];
          if(it.img){if(it.h>ih)ih=it.h;}else if(it.size>ms)ms=it.size;
        }
        if(!ms)ms=size0;
        var nat=ms*1.15*(p.line||cfg.line),desc=ms*0.25,h=Math.max(nat,ih+desc),asc=h-desc;
        pieces.push({h:h,draw:function(y){
          var base=y+asc,off=0,extra=0,j2,lav=(idx===0?avail-firstPt:avail),fx=(idx===0?firstPt:0);
          if(p.align==='center')off=(lav-ln.w)/2;
          else if(p.align==='right')off=lav-ln.w;
          else if(p.align==='justify'&&idx<lines.length-1&&!ln.forced){
            var ns=0;for(j2=0;j2<ln.items.length;j2++)if(ln.items[j2].sp)ns++;
            if(ns)extra=(lav-ln.w)/ns;
          }
          if(off<0)off=0;
          var x=tx+off+fx;
          if(idx===0&&marker){
            var mw=tw(marker,0,size0);
            emit(rgb('000000','rg'));
            emit('BT /F0 '+nn(size0)+' Tf '+nn(tx-mw-5)+' '+nn(PH-base)+' Td '+pdfStr(marker)+' Tj ET');
          }
          for(j2=0;j2<ln.items.length;j2++){
            var it2=ln.items[j2],w2=it2.w+(it2.sp?extra:0);
            var save=it2.w;it2.w=w2;
            drawItem(it2,x,base);
            it2.w=save;
            x+=w2;
          }
        }});
      })(lines[i],i);
    }
    if(aft>0)pieces.push({h:aft,draw:function(){}});
  }

  function layoutTable(t,x0,width,pieces){
    var nc=0,i,j;
    for(i=0;i<t.rows.length;i++)if(t.rows[i].length>nc)nc=t.rows[i].length;
    if(!nc)return;
    var cw=width/nc,pad=4;
    for(i=0;i<t.rows.length;i++){
      var cps=[],rh=16;
      for(j=0;j<nc;j++){
        var c=t.rows[i][j],ps=c?layoutBlocks(c.blocks,x0+j*cw+pad,cw-2*pad):[],hh=2*pad,q;
        for(q=0;q<ps.length;q++)hh+=ps[q].h;
        if(hh>rh)rh=hh;
        cps.push(ps);
      }
      (function(cps,rh){
        pieces.push({h:rh,draw:function(y){
          var j2,q2;
          for(j2=0;j2<nc;j2++){
            emit('0.6 0.6 0.6 RG 0.5 w '+nn(x0+j2*cw)+' '+nn(PH-(y+rh))+' '+nn(cw)+' '+nn(rh)+' re S');
            var yy=y+pad;
            for(q2=0;q2<cps[j2].length;q2++){cps[j2][q2].draw(yy);yy+=cps[j2][q2].h;}
          }
        }});
      })(cps,rh);
    }
    pieces.push({h:6,draw:function(){}});
  }

  function layoutBlocks(blocks,x0,width){
    var pieces=[],i;
    for(i=0;i<blocks.length;i++){
      var b=blocks[i];
      if(b.t==='p')layoutPara(b,x0,width,pieces);
      else if(b.t==='hr')pieces.push({h:12,draw:function(y){emit('0.5 0.5 0.5 RG 0.75 w '+nn(x0)+' '+nn(PH-(y+6))+' m '+nn(x0+width)+' '+nn(PH-(y+6))+' l S');}});
      else if(b.t==='table')layoutTable(b,x0,width,pieces);
    }
    return pieces;
  }

  var pieces=layoutBlocks(ir.blocks,ML,CW);
  var pagesOps=[[]],y=MT,i;
  cur=pagesOps[0];
  for(i=0;i<pieces.length;i++){
    var pc=pieces[i];
    if(y+pc.h>PH-MB&&y>MT+1){pagesOps.push([]);cur=pagesOps[pagesOps.length-1];y=MT;}
    pc.draw(y);y+=pc.h;
  }
  return assemblePDF(pagesOps,images,PW,PH);
}

function assemblePDF(pagesOps,images,PW,PH){
  var chunks=[],pos=0,offs=[];
  function add(x){
    if(typeof x==='string'){var u=new Uint8Array(x.length),i;for(i=0;i<x.length;i++)u[i]=x.charCodeAt(i)&255;x=u;}
    chunks.push(x);pos+=x.length;
  }
  function obj(id,parts){
    offs[id]=pos;add(id+' 0 obj\n');
    var i;for(i=0;i<parts.length;i++)add(parts[i]);
    add('\nendobj\n');
  }
  var FN=['Helvetica','Helvetica-Bold','Helvetica-Oblique','Helvetica-BoldOblique','Times-Roman','Times-Bold','Times-Italic','Times-BoldItalic','Courier','Courier-Bold','Courier-Oblique','Courier-BoldOblique'];
  var nImg=images.length,nPg=pagesOps.length,base=15+nImg,i,kids=[];
  for(i=0;i<nPg;i++)kids.push((base+2*i)+' 0 R');
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2,['<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+nPg+' >>']);
  var fontRes='';
  for(i=0;i<12;i++){
    obj(3+i,['<< /Type /Font /Subtype /Type1 /BaseFont /'+FN[i]+' /Encoding /WinAnsiEncoding >>']);
    fontRes+='/F'+i+' '+(3+i)+' 0 R ';
  }
  var imRes='';
  for(i=0;i<nImg;i++){
    var im=images[i];
    obj(15+i,['<< /Type /XObject /Subtype /Image /Width '+im.info.w+' /Height '+im.info.h+' /ColorSpace /'+(im.info.c===1?'DeviceGray':'DeviceRGB')+' /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.data.length+' >>\nstream\n',im.data,'\nendstream']);
    imRes+='/Im'+i+' '+(15+i)+' 0 R ';
  }
  for(i=0;i<nPg;i++){
    var content=pagesOps[i].join('\n');
    obj(base+2*i,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << '+fontRes+'>> /XObject << '+imRes+'>> >> /Contents '+(base+2*i+1)+' 0 R >>']);
    obj(base+2*i+1,['<< /Length '+content.length+' >>\nstream\n',content,'\nendstream']);
  }
  var total=base+2*nPg,xpos=pos,x='xref\n0 '+total+'\n0000000000 65535 f \n',id;
  for(id=1;id<total;id++)x+=('0000000000'+offs[id]).slice(-10)+' 00000 n \n';
  x+='trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xpos+'\n%%EOF\n';
  add(x);
  return new Blob(chunks,{type:'application/pdf'});
}

/* ===================== preparar e exportar DOCX/PDF ===================== */
function prepare(cb){
  var clone=ed.cloneNode(true);
  clone.removeAttribute('id');
  var o=ed.getElementsByTagName('img'),c=clone.getElementsByTagName('img'),i,todo=[];
  for(i=0;i<c.length;i++){
    var rc=o[i].getBoundingClientRect();
    c[i].setAttribute('data-w',Math.round(rc.width||o[i].naturalWidth||200));
    c[i].setAttribute('data-h',Math.round(rc.height||o[i].naturalHeight||150));
    if(!/^data:image\/jpe?g;base64,/i.test(c[i].getAttribute('src')||''))todo.push(c[i]);
  }
  if(!todo.length){cb(clone);return;}
  var left=todo.length;
  function fin(){left--;if(left===0)cb(clone);}
  function conv(img){
    var im=new Image();
    im.onload=function(){
      try{
        var cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0);
        img.setAttribute('src',cv.toDataURL('image/jpeg',0.85));
      }catch(e){if(img.parentNode)img.parentNode.removeChild(img);}
      fin();
    };
    im.onerror=function(){if(img.parentNode)img.parentNode.removeChild(img);fin();};
    im.src=img.getAttribute('src');
  }
  for(i=0;i<todo.length;i++)conv(todo[i]);
}
function runExport(fn){
  try{fn();}catch(e){alert('Erro ao exportar: '+(e&&e.message?e.message:e));}
}
function exportDocx(){
  prepare(function(root){
    try{saveBlob(makeDocx(buildIR(root)),fname('docx'));}
    catch(e){alert('Erro ao gerar DOCX: '+e.message);}
  });
}
function exportPdf(){
  prepare(function(root){
    try{saveBlob(makePDF(buildIR(root)),fname('pdf'));}
    catch(e){alert('Erro ao gerar PDF: '+e.message);}
  });
}
